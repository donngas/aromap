name: Build and publish images

on:
  workflow_dispatch:
    inputs:
      service:
        description: Images to build and publish
        type: choice
        required: true
        default: both
        options:
          - both
          - frontend
          - backend

permissions:
  contents: read
  packages: write

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.select.outputs.services }}
    steps:
      - id: select
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          case "$SERVICE" in
            both) echo 'services=["frontend","backend"]' >> "$GITHUB_OUTPUT" ;;
            frontend) echo 'services=["frontend"]' >> "$GITHUB_OUTPUT" ;;
            backend) echo 'services=["backend"]' >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

  build:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.select.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set image tags
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          image="ghcr.io/${OWNER,,}/aromap-${SERVICE}"
          {
            echo 'tags<<EOF'
            echo "${image}:${COMMIT}"
            if [ "$REF" = refs/heads/main ]; then echo "${image}:latest"; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }},ignore-error=true
