[project]
name = "aromap-backend"
version = "0.1.0"
description = "Aromap backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=2,<3",
    "opencv-python-headless>=5,<6",
    "pydantic>=2,<3",
    "uvicorn>=0.30,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9,<10",
]
