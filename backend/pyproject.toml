[project]
name = "aromap-backend"
version = "0.1.0"
description = "Aromap backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=2,<3",
    "opencv-python-headless>=5,<6",
    "pydantic>=2,<3",
    "pillow>=11,<13",
    "python-multipart>=0.0.20,<1",
    "shapely>=2.1,<3",
    "uvicorn>=0.30,<1",
    "scipy>=1.15,<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
