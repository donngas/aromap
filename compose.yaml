services:
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "${HOST_BIND:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173"
    environment:
      # Vite (development) and Nginx (staging); not a browser URL.
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
      FRONTEND_MAX_BODY_SIZE: ${FRONTEND_MAX_BODY_SIZE:-12m}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "${HOST_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    environment:
      AROMAP_DATA_DIR: /data
      AROMAP_CORS_ORIGINS: ${AROMAP_CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AROMAP_RECOGNITION_CALLABLE: ${AROMAP_RECOGNITION_CALLABLE:-}
      AROMAP_RECOGNITION_TIMEOUT_SECONDS: ${AROMAP_RECOGNITION_TIMEOUT_SECONDS:-60}
      AROMAP_MAX_UPLOAD_BYTES: ${AROMAP_MAX_UPLOAD_BYTES:-10485760}
      AROMAP_MAX_IMAGE_PIXELS: ${AROMAP_MAX_IMAGE_PIXELS:-20000000}
      AROMAP_RETENTION_SECONDS: ${AROMAP_RETENTION_SECONDS:-86400}
      AROMAP_CLEANUP_INTERVAL_SECONDS: ${AROMAP_CLEANUP_INTERVAL_SECONDS:-60}
      AROMAP_QUEUE_CAPACITY: ${AROMAP_QUEUE_CAPACITY:-4}
      AROMAP_SIMULATION_MAX_WORKING_BYTES: ${AROMAP_SIMULATION_MAX_WORKING_BYTES:-536870912}
    volumes:
      - backend-data:/data
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/scripts:/app/scripts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  backend-data:
